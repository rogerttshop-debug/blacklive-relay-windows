name: Build Mac Intel App
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-13
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      PYTHONIOENCODING: utf8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (x86_64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyarmor
      - name: Confirma arquitetura do runner
        run: python -c "import platform;print('ARCH:',platform.machine())"
      - name: Build (.app Intel)
        run: python build.py
      - name: Zip do .app (preserva bundle)
        run: |
          APP=$(ls -d dist/*.app | head -1)
          echo "APP: $APP"
          file "$APP/Contents/MacOS/"* || true
          ditto -c -k --keepParent "$APP" "BlackLive-Mac-Intel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BlackLive-Mac-Intel
          path: BlackLive-Mac-Intel.zip